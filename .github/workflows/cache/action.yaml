name: 'Restore cache'
runs:
  using: "composite"
  steps:
    # cppcheck is built natively, so a binary built on a newer runner image (newer glibc) doesn't run on an older one
    # ("GLIBC_2.43 not found"). Jobs here run on ubuntu-24.04 and ubuntu-latest: key the cache on the OS version too.
    - name: OS version for the cache key
      id: osver
      shell: bash
      run: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
        else
          echo "id=macos-$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore cached cppcheck
      id: cppcache
      uses: actions/cache@v4
      with:
        path: opendbc/safety/tests/misra/cppcheck/
        key: cppcheck-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.osver.outputs.id }}-${{ hashFiles('opendbc/safety/tests/misra/install.sh') }}
    - name: Set cache-hit output
      run: echo "cache-hit=${{ steps.cppcache.outputs.cache-hit }}" >> $GITHUB_OUTPUT
      shell: bash
